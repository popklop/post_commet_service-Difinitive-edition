services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - STORAGE_TYPE=postgres
      - POSTGRES_DSN=postgres://postgres:pass@postgres:5432/postcommozon?sslmode=disable
      - PORT=8080
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postcommozon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
